<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" width="1200" height="525" font-family="'Share Tech Mono', 'Courier New', monospace" role="img" aria-labelledby="t d">
  <title id="t">AHID at standoff over a station module, and the same module unrolled as the surface grid it navigates</title>
  <desc id="d">Left: a spherical free-flyer holds 1.0 m off a cylindrical module, its work face toward the hull, four range beams meeting the surface at the corners of a camera footprint, a cradle on the hull below. Right: the module unrolled into a flat map of cells, rows along the module axis u, columns around the circumference v, with the vehicle's position, the serpentine scan path, anchor features, the cradle and a keep-out sphere's footprint marked. Every product is keyed to a cell.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#090e1a"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a4470"/><stop offset="45%" stop-color="#4a6a9a"/><stop offset="100%" stop-color="#162744"/></linearGradient>
    <radialGradient id="ball" cx="38%" cy="35%" r="70%"><stop offset="0%" stop-color="#eef4fa"/><stop offset="55%" stop-color="#a8cce8"/><stop offset="100%" stop-color="#3a5a88"/></radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a825"/></marker>
  </defs>
  <rect width="1200" height="525" fill="url(#bg)"/>

  <!-- LEFT: the vehicle at standoff over the module -->
  <g id="scene">
    <text x="40" y="40" fill="#e8a825" font-size="13" letter-spacing="2">A · AT STANDOFF</text>
    <!-- module hull, seen along its axis in oblique -->
    <path d="M60,300 L420,300 L420,460 L60,460 Z" fill="url(#hull)" stroke="#1e3158"/>
    <ellipse cx="420" cy="380" rx="22" ry="80" fill="#1b2d50" stroke="#1e3158"/>
    <ellipse cx="60" cy="380" rx="22" ry="80" fill="#2a4470" stroke="#1e3158"/>
    <path d="M60,300 Q240,282 420,300" fill="none" stroke="#5a8ab0" stroke-width="1" opacity="0.6"/>
    <!-- hull seams (cells) -->
    <g stroke="#5a8ab0" stroke-width="0.6" opacity="0.5">
      <line x1="120" y1="300" x2="120" y2="460"/><line x1="180" y1="300" x2="180" y2="460"/><line x1="240" y1="300" x2="240" y2="460"/><line x1="300" y1="300" x2="300" y2="460"/><line x1="360" y1="300" x2="360" y2="460"/>
      <line x1="60" y1="345" x2="420" y2="345"/><line x1="60" y1="390" x2="420" y2="390"/><line x1="60" y1="435" x2="420" y2="435"/>
    </g>
    <text x="70" y="482" fill="#6a8aaa" font-size="11">MODULE · 4.4 m DIA · 10 m</text>
    <!-- cradle on the hull -->
    <rect x="96" y="292" width="34" height="10" fill="#e8a825" opacity="0.8"/>
    <text x="92" y="284" fill="#e8a825" font-size="10">CRADLE</text>
    <!-- footprint on the hull -->
    <path d="M190,310 L290,310 L302,352 L178,352 Z" fill="#e8a825" fill-opacity="0.12" stroke="#e8a825" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="196" y="372" fill="#e8a825" font-size="10">FOOTPRINT 1.15 × 0.83 m · ONE CELL</text>
    <!-- the vehicle -->
    <circle cx="240" cy="190" r="46" fill="url(#ball)" stroke="#1e3158" stroke-width="1.5"/>
    <rect x="222" y="222" width="36" height="14" rx="2" fill="#111d35" stroke="#5a8ab0" stroke-width="1"/>
    <circle cx="240" cy="229" r="4" fill="#a8cce8"/>
    <!-- thruster ports -->
    <g fill="#111d35" stroke="#5a8ab0" stroke-width="0.8"><circle cx="205" cy="168" r="3.5"/><circle cx="275" cy="168" r="3.5"/><circle cx="200" cy="205" r="3.5"/><circle cx="280" cy="205" r="3.5"/><circle cx="240" cy="146" r="3.5"/></g>
    <!-- range beams to the footprint corners -->
    <g stroke="#a8cce8" stroke-width="1" opacity="0.8">
      <line x1="226" y1="232" x2="190" y2="310"/><line x1="254" y1="232" x2="290" y2="310"/>
      <line x1="226" y1="234" x2="178" y2="352"/><line x1="254" y1="234" x2="302" y2="352"/>
    </g>
    <!-- standoff dimension -->
    <line x1="330" y1="236" x2="330" y2="310" stroke="#e8a825" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="330" y1="310" x2="330" y2="236" stroke="#e8a825" stroke-width="1" marker-end="url(#arr)"/>
    <text x="338" y="278" fill="#e8a825" font-size="11">h = 1.0 m</text>
    <text x="300" y="150" fill="#c8d8ec" font-size="11">AHID · 0.5 m SPHERE</text>
    <text x="300" y="166" fill="#6a8aaa" font-size="10">work face toward the hull</text>
    <text x="300" y="180" fill="#6a8aaa" font-size="10">four range beams · nav camera</text>
    <!-- body axes -->
    <line x1="150" y1="120" x2="150" y2="190" stroke="#5a8ab0" stroke-width="1" marker-end="url(#arr)"/>
    <text x="156" y="188" fill="#5a8ab0" font-size="10">+x boresight</text>
    <text x="60" y="112" fill="#6a8aaa" font-size="10">The body points any face anywhere;</text>
    <text x="60" y="126" fill="#6a8aaa" font-size="10">one face carries the instruments.</text>
  </g>

  <!-- divider -->
  <line x1="500" y1="30" x2="500" y2="495" stroke="#1e3158" stroke-width="1"/>

  <!-- RIGHT: the module unrolled -->
  <g id="map">
    <text x="540" y="40" fill="#e8a825" font-size="13" letter-spacing="2">B · THE SAME MODULE UNROLLED · THE SURFACE GRID</text>
    <!-- grid 18 x 9 shown (rows across v compressed) -->
    <g transform="translate(560,70)">
      <rect x="0" y="0" width="540" height="324" fill="#0d1528" stroke="#1e3158"/>
      <g stroke="#1e3158" stroke-width="0.8">
        <line x1="30" y1="0" x2="30" y2="324"/><line x1="60" y1="0" x2="60" y2="324"/><line x1="90" y1="0" x2="90" y2="324"/><line x1="120" y1="0" x2="120" y2="324"/><line x1="150" y1="0" x2="150" y2="324"/><line x1="180" y1="0" x2="180" y2="324"/><line x1="210" y1="0" x2="210" y2="324"/><line x1="240" y1="0" x2="240" y2="324"/><line x1="270" y1="0" x2="270" y2="324"/><line x1="300" y1="0" x2="300" y2="324"/><line x1="330" y1="0" x2="330" y2="324"/><line x1="360" y1="0" x2="360" y2="324"/><line x1="390" y1="0" x2="390" y2="324"/><line x1="420" y1="0" x2="420" y2="324"/><line x1="450" y1="0" x2="450" y2="324"/><line x1="480" y1="0" x2="480" y2="324"/><line x1="510" y1="0" x2="510" y2="324"/>
        <line x1="0" y1="36" x2="540" y2="36"/><line x1="0" y1="72" x2="540" y2="72"/><line x1="0" y1="108" x2="540" y2="108"/><line x1="0" y1="144" x2="540" y2="144"/><line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="216" x2="540" y2="216"/><line x1="0" y1="252" x2="540" y2="252"/><line x1="0" y1="288" x2="540" y2="288"/>
      </g>
      <!-- inspected cells: rows 0-2 full, row 3 partly -->
      <rect x="0" y="0" width="540" height="108" fill="#e8a825" fill-opacity="0.16"/>
      <rect x="240" y="108" width="300" height="36" fill="#e8a825" fill-opacity="0.16"/>
      <!-- scan path, boustrophedon -->
      <path d="M15,18 H525 V54 H15 V90 H525 V126 H255" fill="none" stroke="#e8a825" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- anchors -->
      <g fill="none" stroke="#a8cce8" stroke-width="1.2">
        <path d="M24,12 l12,12 M36,12 l-12,12"/><path d="M144,12 l12,12 M156,12 l-12,12"/><path d="M264,12 l12,12 M276,12 l-12,12"/><path d="M384,12 l12,12 M396,12 l-12,12"/><path d="M504,12 l12,12 M516,12 l-12,12"/>
        <path d="M24,156 l12,12 M36,156 l-12,12"/><path d="M144,156 l12,12 M156,156 l-12,12"/><path d="M264,156 l12,12 M276,156 l-12,12"/><path d="M384,156 l12,12 M396,156 l-12,12"/><path d="M504,156 l12,12 M516,156 l-12,12"/>
      </g>
      <!-- cradle -->
      <rect x="48" y="4" width="24" height="28" fill="none" stroke="#e8a825" stroke-width="1.5"/>
      <!-- keep-out footprint -->
      <circle cx="162" cy="18" r="34" fill="#e8a825" fill-opacity="0.08" stroke="#e8a825" stroke-width="1" stroke-dasharray="2 3"/>
      <!-- vehicle -->
      <circle cx="255" cy="126" r="9" fill="#a8cce8" stroke="#eef4fa" stroke-width="1.5"/>
      <line x1="255" y1="126" x2="235" y2="126" stroke="#eef4fa" stroke-width="1.5"/>
      <!-- cell callout -->
      <rect x="240" y="108" width="30" height="36" fill="none" stroke="#eef4fa" stroke-width="1.2"/>
      <text x="275" y="150" fill="#eef4fa" font-size="10">cell (8, 3)</text>
    </g>
    <!-- axes -->
    <line x1="560" y1="412" x2="700" y2="412" stroke="#e8a825" stroke-width="1" marker-end="url(#arr)"/>
    <text x="706" y="416" fill="#e8a825" font-size="11">u · along the module · 18 cells</text>
    <line x1="548" y1="394" x2="548" y2="90" stroke="#e8a825" stroke-width="1" marker-end="url(#arr)"/>
    <text x="534" y="392" fill="#e8a825" font-size="10" transform="rotate(-90 534 392)">v · around · 18 cells · wraps</text>
    <!-- legend -->
    <g font-size="10" fill="#c8d8ec">
      <rect x="560" y="432" width="14" height="10" fill="#e8a825" fill-opacity="0.3" stroke="#e8a825" stroke-width="0.6"/><text x="580" y="441">inspected cell · a product on file</text>
      <path d="M786,432 l10,10 M796,432 l-10,10" stroke="#a8cce8" stroke-width="1.2" fill="none"/><text x="804" y="441">anchor · a hatch, seam or handrail the camera fixes on</text>
      <rect x="560" y="454" width="14" height="10" fill="none" stroke="#e8a825" stroke-width="1.2"/><text x="580" y="463">cradle · power, nitrogen, data</text>
      <circle cx="793" cy="459" r="6" fill="none" stroke="#e8a825" stroke-dasharray="2 2"/><text x="804" y="463">keep-out volume where it reaches the standoff shell</text>
      <text x="560" y="484" fill="#6a8aaa">Position is (u, v) on a named surface and h along its normal.</text>
      <text x="560" y="498" fill="#6a8aaa">A cell id is a structural coordinate: coverage, repeat and localization are one map.</text>
    </g>
  </g>
</svg>
