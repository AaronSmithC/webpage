<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" width="1200" height="525" font-family="'Share Tech Mono', 'Courier New', monospace" role="img" aria-labelledby="t d">
  <title id="t">LRMH instrument in section: host-mounted linear actuator driving a tool head into regolith, with force, depth, current and temperature sensing, and the two curves a site test produces</title>
  <desc id="d">A vertical linear actuator hangs from a bracket on the side of a host rover. A lead screw drives a tool shaft through a load cell and a depth encoder; a cone or plate tool head at the bottom penetrates the regolith to a maximum stroke of 350 mm. The regolith shows a loose surface layer over a denser layer with a break near 120 mm. To the right, two plots: penetration resistance versus depth with a step at the layer break, and load versus sinkage for a baseline and a repeat loading showing compaction. A legend lists the site-result quantities.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#090e1a"/></linearGradient>
    <linearGradient id="loose" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c1f27"/><stop offset="100%" stop-color="#171a21"/></linearGradient>
    <linearGradient id="dense" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#14171e"/><stop offset="100%" stop-color="#0e1016"/></linearGradient>
    <pattern id="stip" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="0.7" fill="#3a3f4a"/><circle cx="9" cy="10" r="0.7" fill="#3a3f4a"/></pattern>
    <pattern id="stipd" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="0.7" fill="#454b58"/><circle cx="6" cy="7" r="0.7" fill="#454b58"/></pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#e8a825"/></marker>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#6a8aaa"/></marker>
  </defs>
  <rect width="1200" height="525" fill="url(#sky)"/>
  <g opacity="0.6" fill="#fff"><circle cx="120" cy="40" r="0.8"/><circle cx="470" cy="60" r="0.6"/><circle cx="560" cy="150" r="0.7"/><circle cx="640" cy="30" r="0.9"/><circle cx="220" cy="120" r="0.5"/></g>

  <!-- ground (x 40..640) -->
  <rect x="40" y="330" width="600" height="60.0" fill="url(#loose)"/>
  <rect x="40" y="330" width="600" height="60.0" fill="url(#stip)"/>
  <rect x="40" y="390.0" width="600" height="135.0" fill="url(#dense)"/>
  <rect x="40" y="390.0" width="600" height="135.0" fill="url(#stipd)"/>
  <line x1="40" y1="330" x2="640" y2="330" stroke="#6a8aaa" stroke-width="1.2"/>
  <path d="M40,390.0 C200,385.0 400,396.0 640,390.0" fill="none" stroke="#5a8ab0" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="56" y="340.0" font-size="9" fill="#8a94a3">LOOSE SURFACE LAYER</text>
  <text x="56" y="405.0" font-size="9" fill="#8a94a3">DENSER LAYER</text>
  <text x="56" y="386.0" font-size="8" fill="#7fc4e8">layer break</text>
  <!-- depth scale -->
  <line x1="600" y1="330" x2="600" y2="505.0" stroke="#2a4470"/>
  <line x1="596" y1="330.0" x2="604" y2="330.0" stroke="#2a4470"/><text x="610" y="333.0" font-size="8" fill="#5a8ab0">0 mm</text><line x1="596" y1="380.0" x2="604" y2="380.0" stroke="#2a4470"/><text x="610" y="383.0" font-size="8" fill="#5a8ab0">100 mm</text><line x1="596" y1="430.0" x2="604" y2="430.0" stroke="#2a4470"/><text x="610" y="433.0" font-size="8" fill="#5a8ab0">200 mm</text><line x1="596" y1="480.0" x2="604" y2="480.0" stroke="#2a4470"/><text x="610" y="483.0" font-size="8" fill="#5a8ab0">300 mm</text>
  <line x1="596" y1="505.0" x2="604" y2="505.0" stroke="#a0721a"/><text x="610" y="508.0" font-size="8" fill="#a0721a">350 max stroke</text>

  <!-- host rover fragment (left) -->
  <g stroke="#a8cce8" fill="#0d1528" stroke-width="1.4">
    <path d="M40,180 L200,180 L230,210 L230,260 L40,260 Z"/>
    <circle cx="150" cy="294" r="34" fill="#090e1a"/><circle cx="150" cy="294" r="12" fill="none" stroke="#6a8aaa"/>
    <rect x="40" y="164" width="120" height="14" fill="#090e1a" stroke="#6a8aaa" stroke-width="1"/>
  </g>
  <text x="56" y="144" font-size="9.5" fill="#a8cce8">HOST VEHICLE</text>
  <text x="56" y="156" font-size="7.5" fill="#6a8aaa">rover today · lander later · power, data, thermal</text>
  <!-- mount bracket -->
  <path d="M230,212 L282,212 L282,226 L230,226 Z" fill="#111d35" stroke="#a8cce8" stroke-width="1.2"/>
  <path d="M230,236 L282,236 L282,250 L230,250 Z" fill="#111d35" stroke="#a8cce8" stroke-width="1.2"/>
  <!-- witness target on bracket -->
  <rect x="246" y="264" width="22" height="8" fill="#0d1528" stroke="#e8a825" stroke-width="1"/>
  <text x="240" y="284" font-size="7.5" fill="#a0721a">witness target</text>
  <text x="240" y="294" font-size="7" fill="#3a5478">precheck self-test</text>

  <!-- actuator housing -->
  <g>
    <rect x="302" y="60" width="56" height="160" rx="4" fill="#111d35" stroke="#a8cce8" stroke-width="1.4"/>
    <rect x="314" y="46" width="32" height="14" rx="2" fill="#0d1528" stroke="#a8cce8" stroke-width="1.2"/>
    <!-- lead screw -->
    <line x1="330" y1="72" x2="330" y2="210" stroke="#5a8ab0" stroke-width="3"/>
    <line x1="323" y1="74" x2="337" y2="78" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="83" x2="337" y2="87" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="92" x2="337" y2="96" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="101" x2="337" y2="105" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="110" x2="337" y2="114" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="119" x2="337" y2="123" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="128" x2="337" y2="132" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="137" x2="337" y2="141" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="146" x2="337" y2="150" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="155" x2="337" y2="159" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="164" x2="337" y2="168" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="173" x2="337" y2="177" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="182" x2="337" y2="186" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="191" x2="337" y2="195" stroke="#5a8ab0" stroke-width="0.8"/><line x1="323" y1="200" x2="337" y2="204" stroke="#5a8ab0" stroke-width="0.8"/>
    <!-- carriage / load cell -->
    <rect x="308" y="220" width="44" height="22" fill="#0d1528" stroke="#e8a825" stroke-width="1.4"/>
    <!-- encoder strip -->
    <rect x="360" y="66" width="5" height="150" fill="#090e1a" stroke="#7fc4e8" stroke-width="0.9"/>
    <line x1="360" y1="70" x2="365" y2="70" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="76" x2="365" y2="76" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="82" x2="365" y2="82" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="88" x2="365" y2="88" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="94" x2="365" y2="94" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="100" x2="365" y2="100" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="106" x2="365" y2="106" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="112" x2="365" y2="112" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="118" x2="365" y2="118" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="124" x2="365" y2="124" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="130" x2="365" y2="130" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="136" x2="365" y2="136" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="142" x2="365" y2="142" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="148" x2="365" y2="148" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="154" x2="365" y2="154" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="160" x2="365" y2="160" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="166" x2="365" y2="166" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="172" x2="365" y2="172" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="178" x2="365" y2="178" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="184" x2="365" y2="184" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="190" x2="365" y2="190" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="196" x2="365" y2="196" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="202" x2="365" y2="202" stroke="#7fc4e8" stroke-width="0.6"/><line x1="360" y1="208" x2="365" y2="208" stroke="#7fc4e8" stroke-width="0.6"/>
    <!-- shaft -->
    <rect x="325" y="242" width="10" height="163.0" fill="#0d1528" stroke="#a8cce8" stroke-width="1.2"/>
    <!-- cone tip at 150 mm -->
    <path d="M323,405.0 L330,421.0 L337,405.0 Z" fill="#e8a825"/>
    <!-- displaced regolith cone shading -->
    <path d="M321,330 L326,409.0 L334,409.0 L339,330 Z" fill="#050810" opacity="0.6"/>
  </g>
  <!-- force arrow -->
  <line x1="330" y1="445.0" x2="330" y2="427.0" stroke="#e8a825" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="342" y="445.0" font-size="8" fill="#e8a825">soil reaction · force</text>

  <!-- callouts left/right of actuator -->
  <g font-size="8.5" fill="#c8d8ec">
    <text x="378" y="56" fill="#a8cce8" font-size="9.5">LINEAR ACTUATOR</text>
    <text x="378" y="68" font-size="7.5" fill="#6a8aaa">position or force setpoints · 0.35 m stroke</text>
    <text x="378" y="120" fill="#7fc4e8">DEPTH ENCODER</text>
    <text x="378" y="131" font-size="7.5" fill="#6a8aaa">0–350 mm · ±0.1 mm</text>
    <text x="378" y="170" fill="#c8d8ec">MOTOR CURRENT · TEMP</text>
    <text x="378" y="181" font-size="7.5" fill="#6a8aaa">health channels, fault tiers</text>
    <text x="378" y="232" fill="#e8a825">LOAD CELL</text>
    <text x="378" y="243" font-size="7.5" fill="#6a8aaa">650 N continuous · 100 Hz</text>
    <text x="378" y="401.0" fill="#c8d8ec">TOOL HEAD</text>
    <text x="378" y="412.0" font-size="7.5" fill="#6a8aaa">30° cone · 80 mm plate · 60° cone</text>
    <text x="378" y="423.0" font-size="7.5" fill="#6a8aaa">installed per deployment</text>
  </g>
  <line x1="360" y1="118" x2="374" y2="118" stroke="#5a8ab0" stroke-width="0.7"/>
  <line x1="352" y1="230" x2="374" y2="230" stroke="#a0721a" stroke-width="0.7"/>

  <!-- ghost plate alternative -->
  <g opacity="0.5">
    <rect x="460" y="324" width="40" height="6" fill="none" stroke="#a8cce8" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="480" y1="324" x2="480" y2="290" stroke="#a8cce8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="480" y="284" text-anchor="middle" font-size="7.5" fill="#6a8aaa">plate · load–sinkage</text>
  </g>

  <!-- right: plots -->
  <rect x="660" y="24" width="516" height="477" fill="#090e1a" stroke="#1e3158"/>
  <rect x="660" y="24" width="516" height="2" fill="#e8a825"/>
  <text x="676" y="48" font-size="10" fill="#e8a825" letter-spacing="2">WHAT ONE SITE TEST PRODUCES</text>
  <!-- penetration plot -->
  <rect x="700" y="60" width="220" height="150" fill="#0d1528" stroke="#1e3158"/>
  <path d="M732.8,68.0 L742.3,71.8 L749.9,75.7 L754.7,79.5 L756.3,83.3 L755.6,87.1 L754.3,91.0 L754.2,94.8 L756.7,98.6 L762.5,102.5 L770.9,106.3 L780.5,110.1 L789.6,113.9 L876.2,117.8 L879.9,121.6 L880.7,125.4 L879.6,129.3 L878.5,133.1 L879.1,136.9 L882.7,140.7 L889.4,144.6 L898.4,148.4 L900.0,152.2 L900.0,156.1 L900.0,159.9 L900.0,163.7 L900.0,167.5 L900.0,171.4 L900.0,175.2 L900.0,179.0 L900.0,182.9 L900.0,186.7 L900.0,190.5 L900.0,194.3 L900.0,198.2 L900.0,202.0" fill="none" stroke="#7fc4e8" stroke-width="1.6"/>
  <line x1="710" y1="113.9" x2="910" y2="113.9" stroke="#e8a825" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="906" y="109.9" text-anchor="end" font-size="7.5" fill="#e8a825">layer break</text>
  <text x="708" y="224" font-size="8" fill="#c8d8ec">PENETRATION RESISTANCE vs DEPTH</text>
  <text x="708" y="235" font-size="7.5" fill="#6a8aaa">baseline and post-disturbance · RMH-F-002 / F-003</text>
  <text x="914" y="206" text-anchor="end" font-size="7" fill="#6a8aaa">resistance →</text>
  <text x="704" y="72" font-size="7" fill="#6a8aaa">depth ↓</text>
  <!-- load sinkage plot -->
  <rect x="960" y="60" width="200" height="150" fill="#0d1528" stroke="#1e3158"/>
  <path d="M972.0,192.0 L980.8,177.9 L989.6,165.3 L998.4,154.1 L1007.2,144.0 L1016.0,134.9 L1024.8,126.8 L1033.6,119.5 L1042.4,113.0 L1051.2,107.2 L1060.0,102.0 L1068.8,97.3 L1077.6,93.1 L1086.4,89.3 L1095.2,86.0 L1104.0,83.0 L1112.8,80.3 L1121.6,77.8 L1130.4,75.7 L1139.2,73.7 L1148.0,72.0" fill="none" stroke="#7fc4e8" stroke-width="1.6"/>
  <path d="M972.0,192.0 L980.8,167.6 L989.6,148.0 L998.4,132.4 L1007.2,120.0 L1016.0,110.0 L1024.8,102.1 L1033.6,95.8 L1042.4,90.7 L1051.2,86.7 L1060.0,83.4 L1068.8,80.9 L1077.6,78.8 L1086.4,77.2 L1095.2,75.9 L1104.0,74.8 L1112.8,74.0 L1121.6,73.3 L1130.4,72.8 L1139.2,72.3 L1148.0,72.0" fill="none" stroke="#e8a825" stroke-width="1.4" stroke-dasharray="4 2"/>
  <text x="968" y="224" font-size="8" fill="#c8d8ec">LOAD vs SINKAGE</text>
  <text x="968" y="235" font-size="7.5" fill="#6a8aaa">baseline ramp · repeat load · RMH-F-001</text>
  <text x="1154" y="206" text-anchor="end" font-size="7" fill="#6a8aaa">sinkage →</text>
  <text x="964" y="72" font-size="7" fill="#6a8aaa">load ↑</text>
  <line x1="972" y1="200" x2="990" y2="200" stroke="#7fc4e8" stroke-width="1.4"/><text x="994" y="203" font-size="7" fill="#6a8aaa">baseline</text>
  <line x1="1040" y1="200" x2="1058" y2="200" stroke="#e8a825" stroke-width="1.2" stroke-dasharray="4 2"/><text x="1062" y="203" font-size="7" fill="#6a8aaa">repeat · stiffer</text>
  <!-- site result legend -->
  <line x1="676" y1="258" x2="1160" y2="258" stroke="#1e3158"/>
  <text x="676" y="280" font-size="10" fill="#e8a825" letter-spacing="2">SITE RESULT RECORD</text>
  <g font-size="9" fill="#c8d8ec">
    <text x="676" y="302">Penetration resistance, mean and peak</text>
    <text x="676" y="318">Load–sinkage stiffness · bearing proxy</text>
    <text x="676" y="334">Layer-break depth</text>
    <text x="676" y="350">Compaction delta, baseline to repeat</text>
    <text x="676" y="366">Variability index · per-phase quality</text>
    <text x="676" y="382">Host pose at test start · timestamps</text>
    <text x="676" y="398">Fault flags · recovery tier</text>
  </g>
  <g font-size="8" fill="#5a8ab0">
    <text x="930" y="302">RMH-F-002</text><text x="930" y="318">RMH-F-001</text><text x="930" y="334">RMH-F-002</text><text x="930" y="350">RMH-F-003</text><text x="930" y="382">RMH-F-005</text>
  </g>
  <line x1="676" y1="416" x2="1160" y2="416" stroke="#1e3158"/>
  <g font-size="8" fill="#5a8ab0">
    <text x="676" y="436">SAMPLING  force · depth · stroke · current · bus V · temp @ 100 Hz</text>
    <text x="676" y="450">SITE TEST 2–15 min · 1–256 sites per session</text>
    <text x="676" y="464">RECOVERY  T1 resume phase · T2 skip site · T3 safe</text>
  </g>
  <text x="676" y="490" font-size="8" fill="#3a5478">LRMH-CONCEPT-001 · AEGIS REALIZATION OF THE RMH-CLASS CAPABILITY · NOT TO SCALE</text>
</svg>
