  <line x1="700" y1="95" x2="700" y2="105" stroke="#a8cce8" stroke-width="1.4"/>
  <line x1="780" y1="95" x2="780" y2="105" stroke="#a8cce8" stroke-width="1.4"/>
  <text x="740" y="90" text-anchor="middle" font-size="8.5" fill="#a8cce8">1 m</text>
