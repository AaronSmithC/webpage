    <rect x="936" y="358" width="10" height="10" fill="none" stroke="#7fc4e8"/><text x="954" y="367" fill="#c8d8ec">Seismic-inferred · calibrated</text>
    <text x="954" y="380" fill="#5a8ab0">below drill reach, by tie point</text>
  </g>
  <line x1="936" y1="398" x2="1160" y2="398" stroke="#1e3158"/>
  <g font-size="8" fill="#5a8ab0">
    <text x="936" y="420">SOURCE   compact EM · impulse / sweep</text>
    <text x="936" y="434">ARRAY    4 pods · 1.5–6.0 m offsets</text>
    <text x="936" y="448">ACQ      4 ch · 4 kHz · stacked</text>
    <text x="936" y="462">DRILL    2.5 m typ · 5 m max</text>
  </g>
  <text x="936" y="490" font-size="8" fill="#3a5478">WOK-CONCEPT-001 · NOTIONAL · NOT TO SCALE</text>
