    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#090e1a"/></linearGradient>
    <linearGradient id="dry" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1d24"/><stop offset="100%" stop-color="#14171e"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f2236"/><stop offset="100%" stop-color="#0c1a2b"/></linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b0f18"/><stop offset="100%" stop-color="#070a11"/></linearGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ab5e8" stop-opacity="0.22"/><stop offset="100%" stop-color="#4ab5e8" stop-opacity="0"/></radialGradient>
    <pattern id="stipple" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="0.7" fill="#3a3f4a"/><circle cx="10" cy="11" r="0.7" fill="#3a3f4a"/></pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1e3a5a" stroke-width="0.8"/></pattern>
  </defs>
