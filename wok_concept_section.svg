  <text x="430" y="244" text-anchor="middle" font-size="8.5" fill="#7fc4e8">direct arrival</text>
  <text x="610" y="332.0" text-anchor="middle" font-size="8.5" fill="#e8a825">refracted arrivals carry layer velocity</text>
  
