<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" width="1200" height="525" font-family="'Share Tech Mono', 'Courier New', monospace" role="img" aria-labelledby="t d">
  <title id="t">WOK survey site, cross section: rover with source plate and drill, four-pod geophone line, refracted arrivals through dry regolith into ice-cemented regolith</title>
  <desc id="d">A micro-rover sits on the lunar surface with a seismic source plate on the ground and a drill extended 2.5 m into the subsurface. Four geophone pods lie in a line at 1.5, 3.0, 4.5 and 6.0 m from the plate. Beneath a dry regolith layer about 1.75 m thick lies faster ice-cemented regolith, then a deeper substrate. Direct arrivals run along the surface; refracted arrivals dive to the top of the ice-cemented layer, travel along it, and return to each pod. The drill tip terminates inside the ice-cemented layer, forming the calibration tie point between drill and seismic.</desc>
