      <circle cx="670.0" cy="194" r="2" fill="#7fc4e8"/>
      <text x="670.0" y="180" text-anchor="middle" font-size="9" fill="#6a8aaa">4.5 m</text></g>
    <g><rect x="781.0" y="188" width="18" height="12" rx="2" fill="#0d1528" stroke="#a8cce8" stroke-width="1.4"/>
      <line x1="790.0" y1="200" x2="790.0" y2="208" stroke="#a8cce8" stroke-width="1.4"/>
      <circle cx="790.0" cy="194" r="2" fill="#7fc4e8"/>
      <text x="790.0" y="180" text-anchor="middle" font-size="9" fill="#6a8aaa">6.0 m</text></g>
  <text x="610" y="166" text-anchor="middle" font-size="9.5" fill="#a8cce8">GEOPHONE ARRAY · 4 PODS · ROVER-PLACED</text>
