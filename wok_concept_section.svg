  <text x="936" y="50" font-size="10" fill="#e8a825" letter-spacing="2">SURVEY CYCLE · PER SITE</text>
  <g font-size="9.5" fill="#c8d8ec">
    <text x="936" y="76"><tspan fill="#a0721a">01</tspan>  Traverse to site</text>
    <text x="936" y="94"><tspan fill="#a0721a">02</tspan>  Place array, verify coupling</text>
    <text x="936" y="112"><tspan fill="#a0721a">03</tspan>  Fire stacked strikes, record</text>
    <text x="936" y="130"><tspan fill="#a0721a">04</tspan>  Evaluate onboard for ice</text>
    <text x="936" y="148"><tspan fill="#a0721a">05</tspan>  Drill if warranted, ground truth</text>
    <text x="936" y="166"><tspan fill="#a0721a">06</tspan>  Retrieve, continue to next site</text>
  </g>
  <line x1="936" y1="184" x2="1160" y2="184" stroke="#1e3158"/>
  <text x="936" y="208" font-size="10" fill="#e8a825" letter-spacing="2">PREMISE</text>
  <g font-size="9" fill="#8fa5bd">
    <text x="936" y="228">Ice-cemented regolith transmits</text>
    <text x="936" y="242">seismic energy faster than dry</text>
    <text x="936" y="256">regolith. Where drill and seismic</text>
    <text x="936" y="270">sample the same site, the drill</text>
    <text x="936" y="284">calibrates the seismic.</text>
  </g>
  <line x1="936" y1="302" x2="1160" y2="302" stroke="#1e3158"/>
  <text x="936" y="326" font-size="10" fill="#e8a825" letter-spacing="2">DEPTH OF CONFIDENCE</text>
