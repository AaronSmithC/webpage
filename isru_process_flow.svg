<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" font-family="'Share Tech Mono', 'Courier New', monospace" role="img" aria-labelledby="t d">
  <title id="t">ISRU process flow: lunar ice to water cargo and hydrolox propellant</title>
  <desc id="d">Water is mined from a permanently shadowed crater, extracted thermally, condensed and purified into a surface buffer. From the buffer it splits two ways: cartridge fill and tanker ascent to the depot and station, or electrolysis and liquefaction into LOX and LH2 for the tanker itself. Nothing is supplied from Earth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121c30"/>
      <stop offset="100%" stop-color="#0c1526"/>
    </linearGradient>
    <linearGradient id="boxWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2410"/>
      <stop offset="100%" stop-color="#1a1608"/>
    </linearGradient>
    <linearGradient id="boxProp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102232"/>
      <stop offset="100%" stop-color="#0a1824"/>
    </linearGradient>
    <marker id="arrDim" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#5a8ab0"/>
    </marker>
    <marker id="arrWater" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e8a825"/>
    </marker>
    <marker id="arrProp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#7fc4e8"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1a2840" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="720" height="900" fill="url(#bg)"/>
  <rect width="720" height="900" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="719" height="899" fill="none" stroke="#2a4470"/>

  <!-- header -->
  <text x="28" y="34" font-size="11" fill="#e8a825" letter-spacing="2">// ISRU PROCESS FLOW</text>
  <text x="28" y="54" font-size="15" fill="#a8cce8" letter-spacing="1">SOUTH POLE WATER NODE — ICE TO CARGO AND FUEL</text>
  <text x="692" y="34" font-size="9" fill="#5a8ab0" text-anchor="end" letter-spacing="1">AEGIS STATION / WATER LOGISTICS</text>
  <text x="692" y="48" font-size="9" fill="#5a8ab0" text-anchor="end" letter-spacing="1">REF: WL-ISRU-002</text>
  <line x1="28" y1="66" x2="692" y2="66" stroke="#2a4470"/>

  <!-- main vertical chain: boxes x 140..600 -->
  <g stroke="#2a4470" stroke-width="1">
    <rect x="140" y="88" width="460" height="58" rx="2" fill="url(#box)"/>
    <rect x="140" y="176" width="460" height="58" rx="2" fill="url(#box)"/>
    <rect x="140" y="264" width="460" height="58" rx="2" fill="url(#box)"/>
    <rect x="140" y="352" width="460" height="58" rx="2" fill="url(#box)"/>
    <rect x="140" y="440" width="460" height="66" rx="2" fill="url(#boxWater)" stroke="#e8a825"/>
  </g>
  <g fill="#a8cce8" font-size="13" letter-spacing="1.5" text-anchor="middle">
    <text x="370" y="112">PERMANENTLY SHADOWED CRATER</text>
    <text x="370" y="200">EXCAVATION</text>
    <text x="370" y="288">THERMAL EXTRACTION</text>
    <text x="370" y="376">CONDENSE &amp; PURIFY</text>
    <text x="370" y="466" fill="#e8a825">SURFACE WATER BUFFER</text>
  </g>
  <g fill="#5a8ab0" font-size="9" letter-spacing="0.4" text-anchor="middle">
    <text x="370" y="132">ICE-BEARING REGOLITH AT ~40 K · DEPOSIT ASSESSED FIRST</text>
    <text x="370" y="220">AUTONOMOUS MINING · REGOLITH TO PROCESS HOPPER</text>
    <text x="370" y="308">MICROWAVE / THERMAL HEATING · ICE SUBLIMES · SPOIL RETURNED</text>
    <text x="370" y="396">COLD TRAP · FILTRATION · ONE WATER GRADE FOR CARGO AND FUEL</text>
    <text x="370" y="486" fill="#c8922a">AMBIENT TANK · NOT CRYOGENIC · SMOOTHS PRODUCTION SWINGS</text>
  </g>
  <g stroke="#5a8ab0" stroke-width="1.2" marker-end="url(#arrDim)">
    <line x1="370" y1="146" x2="370" y2="174"/>
    <line x1="370" y1="234" x2="370" y2="262"/>
    <line x1="370" y1="322" x2="370" y2="350"/>
    <line x1="370" y1="410" x2="370" y2="438"/>
  </g>

  <!-- power panel, feeds thermal extraction directly -->
  <g>
    <rect x="28" y="248" width="92" height="90" rx="2" fill="url(#box)" stroke="#2a4470"/>
    <text x="74" y="268" font-size="9" fill="#e8a825" letter-spacing="1.5" text-anchor="middle">POWER</text>
    <text x="74" y="286" font-size="9" fill="#a8cce8" text-anchor="middle">POLAR SOLAR</text>
    <text x="74" y="299" font-size="9" fill="#a8cce8" text-anchor="middle">+ FISSION</text>
    <text x="74" y="318" font-size="8" fill="#5a8ab0" text-anchor="middle">REFINERY</text>
    <text x="74" y="329" font-size="8" fill="#5a8ab0" text-anchor="middle">CLASS</text>
    <line x1="120" y1="293" x2="138" y2="293" stroke="#5a8ab0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrDim)"/>
  </g>

  <!-- split from buffer -->
  <path d="M370,506 L370,528 L230,528 L230,552" fill="none" stroke="#e8a825" stroke-width="1.4" marker-end="url(#arrWater)"/>
  <path d="M370,506 L370,528 L546,528 L546,552" fill="none" stroke="#7fc4e8" stroke-width="1.4" marker-end="url(#arrProp)"/>
  <text x="222" y="546" font-size="9" fill="#e8a825" letter-spacing="1.5" text-anchor="end">CARGO</text>
  <text x="554" y="546" font-size="9" fill="#7fc4e8" letter-spacing="1.5">FUEL</text>

  <!-- cargo branch: x 60..400 -->
  <g stroke="#c8922a" stroke-width="1">
    <rect x="60" y="554" width="340" height="58" rx="2" fill="url(#boxWater)"/>
    <rect x="60" y="642" width="340" height="58" rx="2" fill="url(#boxWater)"/>
    <rect x="60" y="730" width="340" height="70" rx="2" fill="url(#boxWater)"/>
  </g>
  <g fill="#e8a825" font-size="12.5" letter-spacing="1.5" text-anchor="middle">
    <text x="230" y="578">CARTRIDGE FILL</text>
    <text x="230" y="666">TANKER ASCENT</text>
    <text x="230" y="754">DEPOT &amp; STATION</text>
  </g>
  <g fill="#c8922a" font-size="9" letter-spacing="0.4" text-anchor="middle">
    <text x="230" y="598">45 t PER MODULAR TANK CARTRIDGE · BLADDER</text>
    <text x="230" y="686">2,600 m/s TO 100 km LUNAR ORBIT · 45 t WATER</text>
    <text x="230" y="774">PROPELLANT DEPOT — FIRST CUSTOMER</text>
    <text x="230" y="788">AEGIS STATION — 3 m WATER SHIELD · 3.3 Mt</text>
  </g>
  <g stroke="#e8a825" stroke-width="1.2" marker-end="url(#arrWater)">
    <line x1="230" y1="612" x2="230" y2="640"/>
    <line x1="230" y1="700" x2="230" y2="728"/>
  </g>

  <!-- fuel branch: x 420..692 -->
  <g stroke="#3a6a8a" stroke-width="1">
    <rect x="420" y="554" width="272" height="58" rx="2" fill="url(#boxProp)"/>
    <rect x="420" y="642" width="272" height="58" rx="2" fill="url(#boxProp)"/>
    <rect x="420" y="730" width="272" height="70" rx="2" fill="url(#boxProp)"/>
  </g>
  <g fill="#7fc4e8" font-size="12.5" letter-spacing="1.5" text-anchor="middle">
    <text x="556" y="578">ELECTROLYSIS</text>
    <text x="556" y="666">LIQUEFACTION</text>
    <text x="556" y="754">TANKER PROPELLANT</text>
  </g>
  <g fill="#5a8ab0" font-size="9" letter-spacing="0.4" text-anchor="middle">
    <text x="556" y="598">2 H₂O → 2 H₂ + O₂ · RATE-LIMITING STEP</text>
    <text x="556" y="686">LOX AT 90 K · LH₂ AT 20 K · ZERO BOIL-OFF</text>
    <text x="556" y="774">LOX / LH₂ · Isp ~450 s · FILLED AT PAD</text>
    <text x="556" y="788">BURNED SAME DAY · PRODUCE NEAR, USE FAST</text>
  </g>
  <g stroke="#7fc4e8" stroke-width="1.2" marker-end="url(#arrProp)">
    <line x1="556" y1="612" x2="556" y2="640"/>
    <line x1="556" y1="700" x2="556" y2="728"/>
  </g>

  <!-- fuel feeds the ascent -->
  <path d="M420,765 L410,765 L410,671 L402,671" fill="none" stroke="#7fc4e8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrProp)"/>

  <!-- footer -->
  <line x1="28" y1="826" x2="692" y2="826" stroke="#2a4470"/>
  <g font-size="9" letter-spacing="0.8">
    <circle cx="34" cy="852" r="3" fill="#e8a825"/>
    <text x="44" y="856" fill="#a8cce8">WATER CARGO PATH</text>
    <circle cx="200" cy="852" r="3" fill="#7fc4e8"/>
    <text x="210" y="856" fill="#a8cce8">PROPELLANT PATH</text>
    <text x="692" y="856" fill="#e8a825" text-anchor="end">EARTH-SUPPLIED CONSUMABLES: NONE</text>
    <text x="28" y="878" fill="#5a8ab0" font-size="8" letter-spacing="0.3">WATER IS NEVER A CRYOGEN IN THIS CHAIN. THE ONLY CRYOGENS ARE THE PROPELLANTS SPLIT FROM IT AT THE PAD.</text>
  </g>
</svg>
