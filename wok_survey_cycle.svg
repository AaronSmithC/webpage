<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="'Share Tech Mono', 'Courier New', monospace" role="img" aria-labelledby="t2 d2">
  <title id="t2">WOK survey cycle, six panels: traverse, place and verify the array, fire and stack, evaluate onboard, drill, retrieve and continue</title>
  <desc id="d2">Storyboard of one survey site. The rover drives to the site; places four geophone pods with its arm and fires a low-energy test shot to score coupling; lowers the source plate and fires stacked strikes whose refracted arrivals return to each pod; inverts the picks onboard and flags an ice-fast refractor; drills into that layer to form the calibration tie point; then recaptures the pods and moves to the next site.</desc>
