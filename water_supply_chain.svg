<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="'Share Tech Mono', 'Courier New', monospace" role="img" aria-labelledby="t d">
  <title id="t">Lunar water delivery chain: ISRU node, launch pad, tanker ascent to lunar orbit, cartridge return</title>
  <desc id="d">Water moves from the south pole ISRU node to the launch pad in 45 tonne cartridges, rides a hydrolox tanker to 100 km lunar orbit where the propellant depot and Aegis Station receive it, and the empty cartridge returns with the tanker. Fleet of 45 tankers, 2,025 tonnes per day, 3.3 million tonnes total.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121c30"/>
      <stop offset="100%" stop-color="#0c1526"/>
    </linearGradient>
    <linearGradient id="orbitBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1222"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1a1710"/>
    </linearGradient>
    <marker id="aW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e8a825"/>
    </marker>
    <marker id="aD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#5a8ab0"/>
    </marker>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1a2840" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="720" height="470" fill="url(#bg2)"/>
  <rect width="720" height="470" fill="url(#grid2)"/>
  <rect x="0.5" y="0.5" width="719" height="469" fill="none" stroke="#2a4470"/>

  <!-- header -->
  <text x="28" y="34" font-size="11" fill="#e8a825" letter-spacing="2">// DELIVERY ARCHITECTURE</text>
  <text x="28" y="54" font-size="15" fill="#a8cce8" letter-spacing="1">SURFACE TO LUNAR ORBIT — ONE CARTRIDGE AT A TIME</text>
  <text x="692" y="34" font-size="9" fill="#5a8ab0" text-anchor="end" letter-spacing="1">AEGIS STATION / WATER LOGISTICS</text>
  <text x="692" y="48" font-size="9" fill="#5a8ab0" text-anchor="end" letter-spacing="1">REF: WL-CHAIN-001</text>
  <line x1="28" y1="66" x2="692" y2="66" stroke="#2a4470"/>

  <!-- orbit band 84..190 -->
  <rect x="28" y="84" width="664" height="106" rx="2" fill="url(#orbitBox)" stroke="#2a4470" stroke-dasharray="4 3"/>
  <text x="40" y="102" font-size="9" fill="#5a8ab0" letter-spacing="1.5">100 km LUNAR ORBIT</text>

  <g stroke="#2a4470" stroke-width="1">
    <rect x="360" y="110" width="170" height="66" rx="2" fill="url(#box2)"/>
    <rect x="548" y="110" width="132" height="66" rx="2" fill="url(#box2)" stroke="#e8a825"/>
  </g>
  <g font-size="11" letter-spacing="1.2" text-anchor="middle" fill="#a8cce8">
    <text x="445" y="132">PROPELLANT DEPOT</text>
    <text x="614" y="132" fill="#e8a825">AEGIS STATION</text>
  </g>
  <g font-size="8.5" letter-spacing="0.3" text-anchor="middle" fill="#5a8ab0">
    <text x="445" y="149">FIRST CUSTOMER · WATER IN</text>
    <text x="445" y="162">LOX + LH₂ OUT · TOP-OFF</text>
    <text x="614" y="149" fill="#c8922a">3 m WATER SHIELD</text>
    <text x="614" y="162" fill="#c8922a">3.3 Mt · 73,333 LOADS</text>
  </g>
  <line x1="530" y1="143" x2="546" y2="143" stroke="#e8a825" stroke-width="1.2" marker-end="url(#aW)"/>

  <!-- transit zone 190..270 -->
  <!-- ascent arc: pad top to depot bottom -->
  <path d="M360,268 C360,215 360,190 400,180" fill="none" stroke="#e8a825" stroke-width="1.6" marker-end="url(#aW)"/>
  <text x="352" y="210" font-size="9" fill="#e8a825" letter-spacing="1" text-anchor="end">ASCENT 2,600 m/s</text>
  <text x="352" y="223" font-size="8.5" fill="#c8922a" letter-spacing="0.3" text-anchor="end">LUNAR TANKER · 45 t WATER</text>
  <text x="352" y="236" font-size="8.5" fill="#c8922a" letter-spacing="0.3" text-anchor="end">LOX / LH₂ FROM THE PAD</text>

  <!-- return arc: depot bottom to pad top -->
  <path d="M470,180 C470,215 470,240 440,266" fill="none" stroke="#5a8ab0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#aD)"/>
  <text x="482" y="215" font-size="9" fill="#5a8ab0" letter-spacing="1">RETURN 1,800 m/s</text>
  <text x="482" y="228" font-size="8.5" fill="#5a8ab0" letter-spacing="0.3">EMPTY CARTRIDGE</text>
  <text x="482" y="241" font-size="8.5" fill="#5a8ab0" letter-spacing="0.3">FUEL TOPPED OFF AT DEPOT</text>

  <!-- surface boxes 270..336 -->
  <g stroke="#2a4470" stroke-width="1">
    <rect x="40" y="270" width="210" height="66" rx="2" fill="url(#box2)"/>
    <rect x="290" y="270" width="210" height="66" rx="2" fill="url(#box2)"/>
  </g>
  <g font-size="11" letter-spacing="1.2" text-anchor="middle" fill="#a8cce8">
    <text x="145" y="292">ISRU NODE</text>
    <text x="395" y="292">LAUNCH PAD</text>
  </g>
  <g font-size="8.5" letter-spacing="0.3" text-anchor="middle" fill="#5a8ab0">
    <text x="145" y="309">MINING · EXTRACTION · PURIFY</text>
    <text x="145" y="322">WATER BUFFER · CARTRIDGE FILL</text>
    <text x="395" y="309">CARTRIDGE MOUNT · HYDROLOX FILL</text>
    <text x="395" y="322">PAD ELECTROLYSIS + LIQUEFACTION</text>
  </g>
  <line x1="250" y1="303" x2="288" y2="303" stroke="#e8a825" stroke-width="1.2" marker-end="url(#aW)"/>
  <text x="269" y="297" font-size="8" fill="#e8a825" text-anchor="middle">45 t</text>

  <!-- ground band 336..384 -->
  <rect x="28" y="336" width="664" height="48" rx="2" fill="url(#ground)" opacity="0.9"/>
  <text x="40" y="366" font-size="9" fill="#a8a090" letter-spacing="1.5">LUNAR SURFACE · SOUTH POLE</text>
  <text x="680" y="366" font-size="8.5" fill="#a8a090" letter-spacing="0.5" text-anchor="end">NOTHING ON THIS DIAGRAM IS SUPPLIED FROM EARTH</text>

  <!-- stats strip 400..460 -->
  <line x1="28" y1="400" x2="692" y2="400" stroke="#2a4470"/>
  <g text-anchor="middle">
    <text x="94" y="428" font-size="16" fill="#e8a825">45</text>
    <text x="94" y="444" font-size="8" fill="#5a8ab0" letter-spacing="1">TANKERS</text>
    <text x="227" y="428" font-size="16" fill="#e8a825">45 t</text>
    <text x="227" y="444" font-size="8" fill="#5a8ab0" letter-spacing="1">PER CARTRIDGE</text>
    <text x="360" y="428" font-size="16" fill="#e8a825">2,025 t</text>
    <text x="360" y="444" font-size="8" fill="#5a8ab0" letter-spacing="1">PER DAY</text>
    <text x="493" y="428" font-size="16" fill="#e8a825">3.3 Mt</text>
    <text x="493" y="444" font-size="8" fill="#5a8ab0" letter-spacing="1">SHIELD FILL</text>
    <text x="626" y="428" font-size="16" fill="#7fc4e8">0</text>
    <text x="626" y="444" font-size="8" fill="#5a8ab0" letter-spacing="1">EARTH FUEL</text>
  </g>
  <g stroke="#2a4470">
    <line x1="160" y1="410" x2="160" y2="452"/>
    <line x1="293" y1="410" x2="293" y2="452"/>
    <line x1="426" y1="410" x2="426" y2="452"/>
    <line x1="559" y1="410" x2="559" y2="452"/>
  </g>
</svg>
