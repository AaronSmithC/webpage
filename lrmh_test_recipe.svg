<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="'Share Tech Mono', 'Courier New', monospace" role="img" aria-labelledby="t2 d2">
  <title id="t2">LRMH site test in six panels: position, baseline penetration, load ramp, repeat load, post-disturbance penetration, process and report</title>
  <desc id="d2">Storyboard of one site test. The tool is positioned over an undisturbed micro-site after a self-test on a witness target; it penetrates in position mode recording resistance versus depth and finding a layer break; it applies a load ramp with the tool at the surface producing a load–sinkage curve; it repeats the load three times so the compaction response appears; it penetrates again through the disturbed zone to measure the strength change; then the onboard processor writes a site result record and the host moves to the next site.</desc>
