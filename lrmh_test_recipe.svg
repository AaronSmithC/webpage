    <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0%" stop-color="#e8a825" stop-opacity="0.16"/><stop offset="100%" stop-color="#e8a825" stop-opacity="0"/></radialGradient>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#e8a825"/></marker>
  </defs>
