<circle cx="590.1" cy="182.7" r="5" fill="#d95926" stroke="#0f0f0f" stroke-width="2"/>
<circle cx="733.4" cy="133.4" r="5" fill="#d95926" stroke="#0f0f0f" stroke-width="2"/>
<text x="142.9" y="92.3" font-size="12.5" fill="#e8e8e8" text-anchor="start" font-weight="400">266 %: the ring is through the gap</text>
<text x="723.4" y="153.4" font-size="12.5" fill="#e8e8e8" text-anchor="end" font-weight="400">97 %</text>
<line x1="433.1" y1="86.0" x2="433.1" y2="370.0" stroke="#8a8a8a" stroke-width="1"/><text x="439.1" y="362.0" font-size="12" fill="#b9b9b9" text-anchor="start" font-weight="400">working design</text>
<rect x="80" y="433" width="14" height="3" rx="1.5" fill="#3987e5"/><text x="102.0" y="439.0" font-size="12.5" fill="#b9b9b9" text-anchor="start" font-weight="400">a pod pair stuck on for an hour: the ring's lean against the hub, as a share of the gap at the crossing</text><rect x="80" y="453" width="14" height="3" rx="1.5" fill="#d95926"/><text x="102.0" y="459.0" font-size="12.5" fill="#b9b9b9" text-anchor="start" font-weight="400">a ring leaning all the way to that gap: the moment it puts into the hub's neck, as a share of the neck's limit</text>
</svg>
