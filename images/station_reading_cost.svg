<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" role="img" aria-labelledby="t d" font-family="'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Propellant per day against what reads the tilt rate</title><desc id="d">Four bars. The ideal law costs 11 tonnes a day. Pods that are on or off cost 27. Taking the tilt rate from a noisy tilt reading costs 440. A rate sensor brings it back to 17.</desc>
<rect width="860" height="270" fill="#0f0f0f"/>
<text x="30.0" y="28.0" font-size="15" fill="#e8e8e8" text-anchor="start" font-weight="700">What the reading costs</text>
<text x="30.0" y="46.0" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="400">propellant to hold the least steady state the model has, tonnes a day</text>
<text x="378.0" y="94.0" font-size="12.5" fill="#b9b9b9" text-anchor="end" font-weight="400">The ideal law: true state, any moment in any direction</text>
<path d="M390 78 h4.9 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-4.9 z" fill="#3987e5"/><text x="406.9" y="94.0" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="400">11</text>
<text x="378.0" y="138.0" font-size="12.5" fill="#b9b9b9" text-anchor="end" font-weight="400">Pods that are on or off, true state</text>
<path d="M390 122 h19.1 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-19.1 z" fill="#3987e5"/><text x="421.1" y="138.0" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="400">27</text>
<text x="378.0" y="182.0" font-size="12.5" fill="#b9b9b9" text-anchor="end" font-weight="400">Tilt rate found from a tilt reading with 0.001° of noise</text>
<path d="M390 166 h368.8 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-368.8 z" fill="#3987e5"/><text x="770.8" y="182.0" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="400">440</text>
<text x="378.0" y="226.0" font-size="12.5" fill="#b9b9b9" text-anchor="end" font-weight="400">The same reading, with a rate sensor good to 0.00003°/s</text>
<path d="M390 210 h10.1 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-10.1 z" fill="#3987e5"/><text x="412.1" y="226.0" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="400">17</text>
<line x1="390.0" y1="68.0" x2="390.0" y2="242.0" stroke="#2b2b2b" stroke-width="1"/>
</svg>
