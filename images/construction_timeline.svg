  <text x="384" y="416" font-size="12.5" fill="#f0f0f0" text-anchor="end" letter-spacing="0.5">RING 3 ASSEMBLY · FILL · SPIN-UP</text>
  <text x="384" y="434" font-size="10.5" fill="#b9b9b9" text-anchor="end">+12–18 months after Ring 2</text>
  <rect x="922.2" y="404" width="208.9" height="28" rx="3" fill="url(#bar)"/>
  <text x="1026.7" y="422" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">M30–M42</text>
  <rect x="1131.1" y="404" width="208.9" height="28" rx="3" fill="url(#hatch)" stroke="#6fb6d8" stroke-width="1" opacity="0.9"/>
  <text x="1235.6" y="422" font-size="10" fill="#cfe6f2" text-anchor="middle">to M54</text>
  <path d="M713.3,307 L720.3,316 L713.3,325 L706.3,316 Z" fill="#e8a825"/>
  <text x="723.3" y="314" font-size="11" fill="#e8a825" text-anchor="start" letter-spacing="0.5" font-weight="600">FIRST HABITATION · ~MONTH 18</text>
  <text x="723.3" y="329" font-size="10" fill="#b9b9b9" text-anchor="start">Ring 1 pressurised, spun to 1 g, life support active</text>
  <path d="M1131.1,439 L1138.1,448 L1131.1,457 L1124.1,448 Z" fill="#e8a825"/>
  <text x="1121.1" y="446" font-size="11" fill="#e8a825" text-anchor="end" letter-spacing="0.5" font-weight="600">DESIGN COMPLEMENT · MONTH 42–54</text>
  <text x="1121.1" y="461" font-size="10" fill="#b9b9b9" text-anchor="end">three rings operational</text>
  <line x1="400" y1="466" x2="1340" y2="466" stroke="#2b2b2b"/>
  <line x1="40" y1="482" x2="1360" y2="482" stroke="#2b2b2b"/>
  <rect x="40" y="498" width="22" height="10" rx="2" fill="url(#bar)"/><text x="70" y="507" font-size="10.5" fill="#b9b9b9">Baseline span</text>
  <rect x="190" y="498" width="22" height="10" rx="2" fill="url(#hatch)" stroke="#6fb6d8" stroke-width="1"/><text x="220" y="507" font-size="10.5" fill="#b9b9b9">12–18 month interval range</text>
  <rect x="420" y="500" width="22" height="6" rx="2" fill="url(#water)"/><text x="450" y="507" font-size="10.5" fill="#b9b9b9">Tanker deliveries in parallel with structural assembly</text>
  <text x="1360" y="507" font-size="10" fill="#7a7a7a" text-anchor="end">Rings are filled and balanced before they rotate · ring intervals are requirements, not demonstrated schedule</text>
