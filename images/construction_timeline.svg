  <text x="384" y="368" font-size="10.5" fill="#b9b9b9" text-anchor="end">+12–18 months after Ring 1</text>
  <rect x="713.3" y="338" width="208.9" height="28" rx="3" fill="url(#bar)"/>
  <text x="817.8" y="356" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">M18–M30</text>
