<text x="108.0" y="172.0" font-size="11" fill="#d8e4f0" text-anchor="start" font-weight="normal" opacity="1.0">90 kN</text>
<text x="60.0" y="585.0" font-size="10.5" fill="#d8e4f0" text-anchor="start" font-weight="normal" opacity="1.0">Read across: the Rev B propellant load closes a ~240 km single leg; a standalone 1,500 km round trip needs ≥60 kN and a 33 t vehicle.</text>
<text x="60.0" y="603.0" font-size="10.5" fill="#8fa3b8" text-anchor="start" font-weight="normal" opacity="1.0">Round-trip legs are flown in sequence: the outbound leg lands carrying the return load, so its T/W is lower and its loss higher.</text>
