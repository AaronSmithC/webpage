<title id="t">The balance closing on a 45 tonne load</title><desc id="d">Three lines over two hours. With the balance held the ring carries 45 tonnes of imbalance throughout. Balanced from the motion it falls to about 2 tonnes after an hour and a quarter of a tonne after two. With the manifest knowing the load the imbalance never appears.</desc>
