<line x1="431.5" y1="336.0" x2="431.5" y2="150.0" stroke="#6f6f6f" stroke-width="2"/>
<circle cx="431.5" cy="119.0" r="31.0" fill="#143a40" stroke="#3987e5" stroke-width="2"/><circle cx="431.5" cy="119.0" r="29.1" fill="#0f0f0f" stroke="none"/>
