<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 672" role="img" aria-labelledby="t d" font-family="'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Aegis Station as bodies that turn</title><desc id="d">A side view to scale: a 650 metre hub that does not turn, three rings 200 metres apart each 350 metres from the axis to the centre of a 100 metre tube, a dock at each end of the hub, and a neck with a main bearing where the hub passes through each ring.</desc>
