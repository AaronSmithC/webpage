<text x="493.5" y="370.0" font-size="12.5" fill="#b9b9b9" text-anchor="middle" font-weight="400">neck and</text><text x="493.5" y="386.0" font-size="12.5" fill="#b9b9b9" text-anchor="middle" font-weight="400">main bearing</text>
<text x="30.0" y="30.0" font-size="15" fill="#e8e8e8" text-anchor="start" font-weight="700">Aegis Station as bodies that turn</text><text x="30.0" y="48.0" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="400">seen from the side, to scale along and across the hub; each ring is 2.23 Mt and turns at 1.50 rpm</text>
<rect x="30" y="633" width="14" height="3" rx="1.5" fill="#3987e5"/><text x="52.0" y="639.0" font-size="12.5" fill="#b9b9b9" text-anchor="start" font-weight="400">a ring's tube, cut through: the shield is the outer 3 m</text><rect x="410" y="633" width="14" height="3" rx="1.5" fill="#d95926"/><text x="432.0" y="639.0" font-size="12.5" fill="#b9b9b9" text-anchor="start" font-weight="400">the hub's neck through a ring's collar, and its main bearing</text><rect x="30" y="653" width="14" height="3" rx="1.5" fill="#199e70"/><text x="52.0" y="659.0" font-size="12.5" fill="#b9b9b9" text-anchor="start" font-weight="400">a dock, 125 m beyond the outer ring</text>
