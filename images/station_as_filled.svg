<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d" font-family="'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Loads through the deployment order with the trim pumps held and with them working</title><desc id="d">Two panels, main bearing and hub neck, each showing load as a share of its placeholder limit over nineteen days. With the pumps held the bearing reaches 37 percent and the neck 29 percent on day 10, as ring 2 comes up beside ring 1, and again about 16 percent on day 15 as ring 3 comes up. With the pumps working neither passes 3 percent.</desc>
<rect width="860" height="470" fill="#0f0f0f"/>
