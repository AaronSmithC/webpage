<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Gradient One crossing — axial section, Rev C</title>
  <desc id="desc">Axial section through the crossing: the rotating hub on the left with the arm-root ring and an arm, its upper face with three ports at 2.5 m radius, the drum between the hub and the node with its three chambers, the rotor lock and the node lock, the drive reacting into the rotor, the despun core through the drum bore on the main bearing, and the despun node on the right</desc>
  <style>
    text{font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:11px;fill:#e6e6e6;}
    .lab{fill:#9a9a9a;font-size:10px;} .hd{font-family:"Orbitron",system-ui,sans-serif;font-size:11px;letter-spacing:.8px;fill:#e6e6e6;}
    .acc{fill:#4dd0e1;} .num{font-variant-numeric:tabular-nums;} .dim{stroke:#9a9a9a;stroke-width:1;fill:none;} .dimt{fill:#9a9a9a;font-size:10px;}
  </style>
  <rect x="0" y="0" width="960" height="520" fill="#0f0f0f"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4dd0e1"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1"/></pattern>
  </defs>
  <line x1="16" y1="260.0" x2="670.0" y2="260.0" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="6 6"/><text class="lab" x="20" y="254.0">SPIN AXIS</text><text class="lab" x="20" y="272.0">z up it from the hub's centre</text>
  <rect x="180.0" y="192.5" width="180.0" height="135.0" rx="8" fill="#143a40" stroke="#4dd0e1" stroke-width="2"/>
  <text class="hd acc" x="270.0" y="256.0" text-anchor="middle">ROTATING HUB</text><text class="lab" x="270.0" y="272.0" text-anchor="middle">Ø 4.5 m · 6 m long · 0 g · 2 crew</text>
  <line x1="270.0" y1="192.5" x2="270.0" y2="80.0" stroke="#4dd0e1" stroke-width="2.5"/>
  <rect x="255.0" y="74.0" width="30.0" height="12" fill="#143a40" stroke="#4dd0e1" stroke-width="2"/>
  <line x1="270.0" y1="327.5" x2="270.0" y2="440.0" stroke="#4dd0e1" stroke-width="2.5"/>
  <rect x="255.0" y="434.0" width="30.0" height="12" fill="#143a40" stroke="#4dd0e1" stroke-width="2"/>
  <path d="M270.0 446.0 V474.0" stroke="#4dd0e1" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
  <text class="lab acc" x="270.0" y="40.0" text-anchor="middle">the arm-root ring, r = 6 m: the arms hinge on it · the section is along arm A</text>
  <text class="lab" x="260.0" y="466.0" text-anchor="end">arm A · the car rail, the water lines</text>
  <rect x="354.0" y="125.0" width="8" height="270.0" fill="#4dd0e1" opacity=".85"/>
  <rect x="354.0" y="178.0" width="8" height="14" fill="#0b0b0b" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="354.0" y="328.0" width="8" height="14" fill="#0b0b0b" stroke="#e6e6e6" stroke-width="1"/>
  <text class="lab" x="24" y="60.0">the hub's upper face, +3 m: three ports at r = 2.5 m, one to an arm</text>
  <rect x="375.0" y="140.0" width="120.0" height="75.0" fill="#101010" stroke="#e6e6e6" stroke-width="2"/>
  <rect x="375.0" y="215.0" width="120.0" height="7.5" fill="url(#hatch)"/>
  <rect x="375.0" y="305.0" width="120.0" height="75.0" fill="#101010" stroke="#e6e6e6" stroke-width="2"/>
  <rect x="375.0" y="297.5" width="120.0" height="7.5" fill="url(#hatch)"/>
  <rect x="390.0" y="155.0" width="90.0" height="60.0" rx="10" fill="#143a40" stroke="#4dd0e1" stroke-width="2"/>
  <rect x="390.0" y="178.0" width="4" height="14" fill="#4dd0e1"/><rect x="476.0" y="178.0" width="4" height="14" fill="#4dd0e1"/>
  <rect x="390.0" y="305.0" width="90.0" height="60.0" rx="10" fill="#143a40" stroke="#4dd0e1" stroke-width="2"/>
  <rect x="390.0" y="328.0" width="4" height="14" fill="#4dd0e1"/><rect x="476.0" y="328.0" width="4" height="14" fill="#4dd0e1"/>
  <line x1="435.0" y1="189.0" x2="435.0" y2="171.0" stroke="#4dd0e1" stroke-width="1.2" marker-end="url(#arA)"/>
  <text class="hd" x="435.0" y="74.0" text-anchor="middle">THE DRUM</text>
  <text class="lab" x="435.0" y="88.0" text-anchor="middle">Ø 8 m · 3 m bore · 4 m long · 13.8 t with its chambers</text>
  <text class="lab" x="435.0" y="102.0" text-anchor="middle">three chambers Ø 2 × 3 m at r = 2.5 m, two crew each · 0.007 g, floor outward</text>
  <line class="dim" x1="375.0" y1="126.0" x2="495.0" y2="126.0" marker-start="url(#ar)" marker-end="url(#ar)"/><text class="dimt" x="435.0" y="122.0" text-anchor="middle">4 m</text>
  <rect x="367.0" y="126.0" width="8" height="14" fill="#d3756a"/>
  <rect x="495.0" y="126.0" width="8" height="14" fill="#d3756a"/>
  <rect x="362.0" y="145.0" width="6" height="16" fill="#4dd0e1"/><rect x="377.0" y="145.0" width="6" height="16" fill="#e6e6e6"/>
  <rect x="367.0" y="380.0" width="8" height="14" fill="#d3756a"/>
  <rect x="495.0" y="380.0" width="8" height="14" fill="#d3756a"/>
  <rect x="362.0" y="359.0" width="6" height="16" fill="#4dd0e1"/><rect x="377.0" y="359.0" width="6" height="16" fill="#e6e6e6"/>
  <text class="lab" x="371.0" y="408.0" text-anchor="middle">rotor lock</text><text class="lab" x="499.0" y="408.0" text-anchor="middle">node lock</text>
  <text class="lab" x="367.0" y="466.0">the drive: stator on the hub's face, rotor on the drum · it reacts into the rotor</text>
  <text class="lab" x="367.0" y="480.0">a lock engages inside 10 mm at the berths and 3e-4 rad/s · a release under load jams its dogs</text>
  <rect x="362.0" y="222.5" width="148.0" height="75.0" fill="#3a3a3a" stroke="#8f8f8f" stroke-width="2"/>
  <rect x="362.0" y="216.5" width="10" height="6" fill="url(#hatch)"/><rect x="362.0" y="297.5" width="10" height="6" fill="url(#hatch)"/>
  <text class="lab" x="435.0" y="256.0" text-anchor="middle">despun core</text><text class="lab" x="435.0" y="270.0" text-anchor="middle">Ø 2.5 m corridor</text>
  <line x1="368.0" y1="303.5" x2="234.0" y2="349.5" stroke="#9a9a9a" stroke-width="1"/><text class="lab" x="234.0" y="363.5" text-anchor="middle">the main bearing and the despin drive</text>
  <rect x="508.0" y="125.0" width="8" height="270.0" fill="#8f8f8f"/>
  <rect x="508.0" y="178.0" width="8" height="14" fill="#0b0b0b" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="508.0" y="328.0" width="8" height="14" fill="#0b0b0b" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="516.0" y="192.5" width="114.0" height="135.0" rx="8" fill="#3a3a3a" stroke="#8f8f8f" stroke-width="2"/>
  <text class="hd" x="579.0" y="256.0" text-anchor="middle">DESPUN NODE</text><text class="lab" x="579.0" y="272.0" text-anchor="middle">docking · arrays · 0 rpm</text>
  <circle cx="570.0" cy="317.5" r="2.5" fill="#e6e6e6"/><text class="lab" x="610.0" y="343.5">mass centre, +10 m up the axis</text>
  <text class="lab" x="516.0" y="115.0">the node's lower face, +8 m: three ports</text>
  <path d="M594.0 192.5 V148.5 M594.0 327.5 V371.5" stroke="#8f8f8f" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <text class="lab" x="594.0" y="142.5" text-anchor="middle">arrays · the docked crew vehicles</text>
  <line class="dim" x1="690.0" y1="140.0" x2="690.0" y2="260.0"/><line class="dim" x1="686.0" y1="140.0" x2="694.0" y2="140.0"/><text class="dimt" x="695.0" y="152.0">r 4 m</text><text class="dimt" x="695.0" y="164.0">the drum</text>
  <line class="dim" x1="780.0" y1="185.0" x2="780.0" y2="260.0"/><line class="dim" x1="776.0" y1="185.0" x2="784.0" y2="185.0"/><text class="dimt" x="785.0" y="197.0">r 2.5 m</text><text class="dimt" x="785.0" y="209.0">the berths</text>
  <line class="dim" x1="870.0" y1="222.5" x2="870.0" y2="260.0"/><line class="dim" x1="866.0" y1="222.5" x2="874.0" y2="222.5"/><text class="dimt" x="875.0" y="234.5">r 1.25 m</text><text class="dimt" x="875.0" y="246.5">the core</text>
  <text class="hd" x="640.0" y="390">ON THE FLIGHT SOFTWARE'S IMAGE</text>
  <text class="lab" x="640.0" y="410">to the node in 182 s of drive, back in 207 s</text>
  <text class="lab" x="640.0" y="425">three chambers ready at a side's ports in 216 s</text>
  <text class="lab" x="640.0" y="440">the node held to 7.8e-05 rad/s through it</text>
  <text class="lab" x="640.0" y="455">the spin where it was</text>
  <text class="lab" x="940" y="508" text-anchor="end">30 px per metre · the hub's face and the node's drawn to the locks' reach · cyan turns, grey is despun, the drum is neither until a lock says so</text>
</svg>
