 .berth { fill: #D7BDE2; stroke: #6C3483; stroke-width: 0.8; } .rack { fill: #F9E79F; stroke: #7D6608; stroke-width: 0.8; }
 .suit { fill: #FADBD8; stroke: #922B21; stroke-width: 0.8; } .med { fill: #FADBD8; stroke: #C0392B; stroke-width: 0.8; }
 .sci { fill: #D5F5E3; stroke: #27AE60; stroke-width: 0.8; } .galley { fill: #FDEBD0; stroke: #CA6F1E; stroke-width: 0.8; }
