<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><style>text{font-family:Arial,Helvetica,sans-serif}.t{font-size:15px;font-weight:bold;fill:#e6edf3;letter-spacing:.12em}.s{font-size:10px;fill:#8ea1b3;letter-spacing:.08em}.l{font-size:10px;fill:#c9d4de}.n{font-size:9px;fill:#8ea1b3}.d{stroke:#e0a458;stroke-width:1;fill:none}.dt{font-size:9px;fill:#e0a458}</style><pattern id="reg" patternUnits="userSpaceOnUse" width="8" height="8"><rect width="8" height="8" fill="#2a2d33"/><circle cx="3" cy="4" r="0.8" fill="#3a3e46"/></pattern></defs>
<rect width="1200" height="700" fill="#0d1117"/>
<text x="600.0" y="34" text-anchor="middle" class="t">STACKED SOLAR-SHADE RADIATOR — REV B CANOPY CONFIGURATION</text>
<text x="600.0" y="52" text-anchor="middle" class="s">EQUATORIAL-BELT FIXED ASSET · CANOPY 3 m ABOVE THE RADIATOR · SHADE GUARANTEED FOR SUN ≥ 70° · NOT TO SCALE</text>
